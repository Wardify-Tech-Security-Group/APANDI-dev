name: APANDI DevSecOps CI/CD Pipeline (PHP 8.3 + MariaDB 11.4 - Ley 19.628)

on:
  push:
    branches: [ main, staging, develop, Desarrollo ]
  pull_request:
    branches: [ main, staging, develop, Desarrollo ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ===========================================================================
  # ETAPA 1: GUARDIÁN ANTI-FILTRACIONES (SAST, Secret Scanning & SQL Leak Guard)
  # ===========================================================================
  security-leak-guard:
    name: "1. Guardián Anti-Filtraciones (.env / Respaldos / Tablas Antiguas)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear archivos .env, llaves privadas o volcados de respaldo en Git
        run: |
          echo "Verificando que ningún archivo .env, llave o volcado sensible esté versionado..."
          TRACKED_FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.sql\.(gz|bz2|zip|bak)$|\.dump$|\.bak$|\.pem$|\.key$' || true)
          if [ -n "$TRACKED_FORBIDDEN" ]; then
            echo "❌ ERROR CRÍTICO DE SEGURIDAD: Archivos sensibles detectados en el repositorio:"
            echo "$TRACKED_FORBIDDEN"
            exit 1
          fi
          echo "✔ Ningún archivo .env ni respaldo sensible está versionado."

      - name: Verificar ausencia total del esquema SQL filtrado (sgi_apandi / tablas antiguas)
        run: |
          echo "Buscando rastros del SQL antiguo filtrado o contraseñas comprometidas..."
          LEAK_MATCHES=$(grep -rnE "sgi_apandi|Apandi2026!|RootApandi2026!|CREATE TABLE IF NOT EXISTS (Roles|Usuarios|Logs_Auditoria|Ficha_Clinica|Estudiantes|Apoderados)" public/ database/ Dockerfile docker-compose.yml || true)
          if [ -n "$LEAK_MATCHES" ]; then
            echo "❌ ERROR: Se encontraron referencias al esquema o contraseñas filtradas:"
            echo "$LEAK_MATCHES"
            exit 1
          fi
          echo "✔ Cero referencias al esquema antiguo."

  # ===========================================================================
  # ETAPA 2: PRUEBAS DE INTEGRACIÓN PHP 8.3 + MARIADB 11.4 EFÍMERO + AES-256-GCM
  # ===========================================================================
  db-schema-and-crypto-tests:
    name: "2. Test PHP 8.3 + Esquema Blindado (apx_*) & Cifrado AES-256-GCM"
    needs: security-leak-guard
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: CiRt9_vN3_zX9_pL5_mK2_qW7_bC4_jF6dG0
          MARIADB_DATABASE: apandi_vault_ci_db
          MARIADB_USER: apx_ci_sec_usr
          MARIADB_PASSWORD: CiDv9_mK4_xP8_qL2_zR7_wN5_vB3_tY6cH1
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      TZ: America/Santiago
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: apx_ci_sec_usr
      DB_PASSWORD: CiDv9_mK4_xP8_qL2_zR7_wN5_vB3_tY6cH1
      DB_NAME: apandi_vault_ci_db
      AES_MASTER_KEY: c4f9a2e7b1d803659a4e7f2c8b1d60395e8a2f4c7b1d9036a5e8c2f4b7d10963
      JWT_SECRET: 7f4a9c2e8b1d6035a9e4c7f2b8d16039e5a2c8f4b7d19036a5e8c2f4b7d10963c4f9a2e7b1d80365
      APP_DEFAULT_USER_PASSWORD: Ap4nd1#S3cV4ult!2026_Cl
      APP_DEFAULT_SIGNATURE_PIN: "849206"

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar PHP 8.3 (PDO MySQL, OpenSSL AES-256-GCM, MBString)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo, pdo_mysql, mysqli, openssl, json
          coverage: none

      - name: Validar sintaxis de todos los archivos PHP (Linting)
        run: find public/ scripts/ -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Ejecutar Verificador DevSecOps (19 Tablas apx_*, Bcrypt Cost 12 y AES-256-GCM)
        run: php scripts/ci-security-check.php

      - name: Smoke Test End-to-End de API PHP (Login JWT y Desencriptación Ficha Clínica Ley 19.628)
        run: |
          php -S 127.0.0.1:8000 -t public > php-server.log 2>&1 &
          SERVER_PID=$!
          sleep 2

          echo "1) Verificando endpoint /api/index.php?route=health..."
          curl -fsS "http://127.0.0.1:8000/api/index.php?route=health" | grep -q '"status":"OK"'

          echo "2) Verificando Login JWT con contraseña de alta entropía..."
          LOGIN_JSON=$(curl -fsS -X POST "http://127.0.0.1:8000/api/index.php?route=auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"emailOrRut\":\"15.432.198-K\",\"password\":\"$APP_DEFAULT_USER_PASSWORD\"}")
          TOKEN=$(php -r '$d = json_decode($argv[1], true); echo $d["token"] ?? "";' "$LOGIN_JSON")

          if [ -z "$TOKEN" ]; then
            echo "❌ Falló la emisión del token JWT: $LOGIN_JSON"
            cat php-server.log
            exit 1
          fi

          echo "3) Verificando desencriptación en memoria de Ficha Clínica (apx_med_dossier_clinico_enc)..."
          curl -fsS "http://127.0.0.1:8000/api/index.php?route=clinico/expediente/1" \
            -H "Authorization: Bearer $TOKEN" | grep -q "Discapacidad Intelectual Moderada"

          kill $SERVER_PID || true
          echo "✔ Smoke Test End-to-End superado."

  # ===========================================================================
  # ETAPA 3: BUILD DE IMAGEN DOCKER APACHE + PHP 8.3
  # ===========================================================================
  docker-build-and-verify:
    name: "3. Build Imagen Docker (PHP 8.3 + Apache)"
    needs: db-schema-and-crypto-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Construir imagen Docker de APANDI Web
        run: docker build -t apandi-web:${{ github.sha }} .

  # ===========================================================================
  # ETAPA 4: DESPLIEGUE SEGURO A PRODUCCIÓN / CPANEL CHILE
  # ===========================================================================
  deploy-production:
    name: "4. Despliegue Producción (Inyección de Secretos desde GitHub Vault)"
    needs: docker-build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verificar y ejecutar despliegue seguro a Producción
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DB_NAME: ${{ secrets.PROD_DB_NAME }}
          PROD_DB_USER: ${{ secrets.PROD_DB_USER }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_ROOT_PASSWORD: ${{ secrets.PROD_DB_ROOT_PASSWORD }}
          PROD_AES_MASTER_KEY: ${{ secrets.PROD_AES_MASTER_KEY }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        run: |
          if [ -z "$PROD_SSH_HOST" ]; then
            echo "ℹ️ Secret PROD_SSH_HOST no configurado aún en el repositorio; artefactos validados y listos para despliegue en cPanel / Docker."
            exit 0
          fi
          echo "🚀 Iniciando despliegue seguro hacia $PROD_SSH_HOST..."
