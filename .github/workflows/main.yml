name: CI/CD Pipeline - SGI Backend PHP

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2' # Ajusta a la versión de tu servidor cPanel
        extensions: mbstring, xml, pdo_mysql, json
        tools: composer

    - name: Validar sintaxis de PHP
      run: find . -name "*.php" -print0 | xargs -0 -n1 php -l

    # Opcional: Si usas Composer, descomenta las siguientes líneas
    # - name: Instalar dependencias con Composer
    #   run: composer install --prefer-dist --no-progress

  deploy-production:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue a cPanel por FTP/SFTP
        run: echo "Aquí puedes configurar un action como 'FTP-Deploy-Action' para enviar los archivos PHP a tu public_html en cPanel."
